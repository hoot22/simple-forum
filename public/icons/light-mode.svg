<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 100 100" role="img" aria-label="日间模式">
  <!-- 图标主体。背景由按钮自身提供，这里保持透明，避免在深色页头里出现方块 -->
  <g fill="#EAEAEA">
    <!-- 中心圆 -->
    <circle cx="50" cy="50" r="20" />

    <!-- 上下左右四个长方形光线 -->
    <rect x="45" y="12" width="10" height="12" />
    <rect x="45" y="76" width="10" height="12" />
    <rect x="12" y="45" width="12" height="10" />
    <rect x="76" y="45" width="12" height="10" />

    <!-- 四个斜角方向的菱形光线（通过旋转正方形实现） -->
    <rect x="23" y="23" width="8" height="8" transform="rotate(45 27 27)" />
    <rect x="69" y="23" width="8" height="8" transform="rotate(45 73 27)" />
    <rect x="23" y="69" width="8" height="8" transform="rotate(45 27 73)" />
    <rect x="69" y="69" width="8" height="8" transform="rotate(45 73 73)" />
  </g>
</svg>
